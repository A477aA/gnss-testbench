# Конвейер стенда тестирования ПО GNSS-приёмников.
#
#   lint ──► test ──► acceptance ──► hardware (вручную, на стенде с приёмником)
#
# Результаты unit-тестов и критериев приёмки публикуются как JUnit — GitLab
# показывает их во вкладке Tests у pipeline и merge request.

stages: [lint, test, acceptance, hardware]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/pip]
  before_script:
    - pip install -q -e ".[dev]"
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── lint ────────────────────────────────────────────────────────────────────────

ruff:
  stage: lint
  script:
    - ruff check --output-format=gitlab --output-file=gl-code-quality.json . || (ruff check . && false)
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality.json

mypy:
  stage: lint
  script:
    - mypy

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  before_script: []
  script:
    - shellcheck scripts/*.sh

# ── test ────────────────────────────────────────────────────────────────────────

.pytest:
  stage: test
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      junit: report-*.xml

unit:
  extends: .pytest
  script:
    - pytest tests/unit tests/property --junitxml=report-unit.xml
        --cov --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      junit: report-unit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

integration:
  extends: .pytest
  script:
    - pytest -m integration --junitxml=report-integration.xml

# ── acceptance: каждый сценарий — отдельный job ───────────────────────────────────

acceptance:
  stage: acceptance
  needs: [unit, integration]
  parallel:
    matrix:
      - SCENARIO: open_sky_rtk
        CRITERIA: rtk_static
        EXPECT: pass
      - SCENARIO: noisy_serial
        CRITERIA: serial_robustness
        EXPECT: pass
      - SCENARIO: urban_canyon      # дефекты внесены — стенд обязан их поймать
        CRITERIA: rtk_static
        EXPECT: fail
      - SCENARIO: tunnel_dropout
        CRITERIA: rtk_static
        EXPECT: fail
  script:
    - bash scripts/acceptance.sh "scenarios/$SCENARIO.toml" "criteria/$CRITERIA.toml" "$EXPECT" reports
  artifacts:
    name: "acceptance-$SCENARIO"
    when: always
    expire_in: 2 weeks
    paths: [reports/]
    reports:
      junit: reports/*.junit.xml

# ── hardware: реальный приёмник на раннере стенда ────────────────────────────────
# Раннер зарегистрирован с тегом gnss-bench, приёмник подключён по USB,
# антенна — на крыше с открытым небом. Запускается вручную или по расписанию.

hardware-smoke:
  stage: hardware
  tags: [gnss-bench]
  needs: [acceptance]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    GNSS_PORT: /dev/ttyUSB0
  script:
    - pytest -m hardware --gnss-port "$GNSS_PORT" --gnss-duration 120 --junitxml=report-hardware.xml
    - bash scripts/capture.sh -p "$GNSS_PORT" -d 300 -c criteria/rtk_static.toml
  artifacts:
    when: always
    paths: [logs/]
    reports:
      junit: report-hardware.xml
